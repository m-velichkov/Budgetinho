# Builds the site and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repository: Settings -> Pages -> "Build and deployment"
# -> Source: "GitHub Actions". No secrets and no other configuration needed --
# the app has no backend and no build-time credentials.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A broken build should never reach the phone that holds the budget.
      - run: npm test
      - run: npm run build

      # enablement: true turns Pages on via the API on the first run, so there
      # is no manual 'Settings -> Pages -> Source: GitHub Actions' step. It is
      # a no-op once Pages is already enabled.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
