# Builds the site and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repository: Settings -> Pages -> "Build and deployment"
# -> Source: "GitHub Actions". No secrets and no other configuration needed --
# the app has no backend and no build-time credentials.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A broken build should never reach the phone that holds the budget.
      - run: npm test
      - run: npm run build

      # Pages must be enabled ONCE by a repo admin:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # enablement below only works when the workflow token is allowed to
      # create the Pages site; on most accounts it is not, and this step
      # fails until that setting is flipped by hand. It is a no-op after.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
